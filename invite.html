<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- OG-START -->
<title>모바일 청첩장</title>
<meta name="description" content="소중한 분들을 초대합니다">
<meta property="og:type" content="website">
<meta property="og:title" content="모바일 청첩장">
<meta property="og:description" content="소중한 분들을 초대합니다">
<!-- OG-END -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF8F3; --ink:#2A2620; --ink-soft:#7A7266; --line:#E7DFD2; --accent:#9C8563;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card{ max-width:460px; margin:0 auto; min-height:100vh; background:#fff; box-shadow:0 0 40px rgba(0,0,0,0.06); position:relative; }

  .carousel{ position:relative; width:100%; aspect-ratio:4/5; background:#EFEAE0; overflow:hidden; }
  .carousel-track{
    display:flex; width:100%; height:100%; overflow-x:auto; scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .carousel-track::-webkit-scrollbar{ display:none; }
  .carousel-slide{ flex:0 0 100%; scroll-snap-align:center; height:100%; }
  .carousel-slide img{ width:100%; height:100%; object-fit:cover; display:block; }
  .carousel-dots{ position:absolute; bottom:14px; left:0; right:0; display:flex; justify-content:center; gap:6px; }
  .carousel-arrow{
    position:absolute; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%;
    background:rgba(255,255,255,0.85); border:none; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:15px; color:var(--ink); z-index:2; box-shadow:0 1px 4px rgba(0,0,0,0.15);
  }
  .carousel-arrow.prev{ left:10px; }
  .carousel-arrow.next{ right:10px; }
  .carousel-arrow:hover{ background:#fff; }
  .carousel-dot{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.55); }
  .carousel-dot.active{ background:#fff; }
  .carousel-empty{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:13px; }

  .content{ padding:38px 30px 50px; text-align:center; }
  .eyebrow{ font-size:11.5px; letter-spacing:0.18em; color:var(--accent); margin:0 0 14px; }
  .names{ font-family:'Noto Serif KR', serif; font-size:26px; font-weight:500; margin:0; line-height:1.5; }
  .names .amp{ color:var(--accent); font-weight:400; margin:0 8px; font-size:20px; }
  .phrase{
    margin:26px 0; font-size:14px; line-height:1.9; color:var(--ink-soft); white-space:pre-wrap;
    padding:0 4px;
  }
  .divider{ width:32px; height:1px; background:var(--line); margin:26px auto; }
  .datetime{ font-family:'Noto Serif KR', serif; font-size:19px; margin:0 0 6px; }
  .datetime-sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 22px; }
  .venue-name{ font-size:15px; font-weight:500; margin:0 0 4px; }
  .venue-address{ font-size:12.5px; color:var(--ink-soft); margin:0; }

  .block-text{ margin:0 0 14px; }
  .heading{ font-family:'Noto Serif KR', serif; font-size:20px; font-weight:500; margin:0 0 14px; line-height:1.5; white-space:pre-wrap; }
  .map-actions{ display:flex; gap:8px; justify-content:center; margin-top:16px; }
  .map-btn{
    font:inherit; font-size:13px; padding:9px 16px; border-radius:20px; border:1px solid var(--line);
    background:#fff; color:var(--ink); text-decoration:none; cursor:pointer;
  }
  .map-btn.primary{ background:#03C75A; border-color:#03C75A; color:#fff; }
  .loading{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13px; }
</style>
</head>
<body>
  <div class="card" id="card" style="display:none;"><div class="content" id="content"></div></div>
  <div class="loading" id="loadingState">청첩장을 불러오는 중...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCv4C_YQfPmq3vWAzfH9hicceBKn7uGDcQ",
  authDomain: "wedding-log-ab8be.firebaseapp.com",
  projectId: "wedding-log-ab8be",
  storageBucket: "wedding-log-ab8be.firebasestorage.app",
  messagingSenderId: "1051939244748",
  appId: "1:1051939244748:web:42e1b03187ce036f8c9069",
  measurementId: "G-MMCL30SMFV"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const invitationRef = doc(db, "app", "invitation");
const photosCol = collection(db, "invitationPhotos");

const $ = s => document.querySelector(s);
const wantedId = new URLSearchParams(location.search).get('d');
let invData = null;
let photos = [];
let gotInv = false, gotPhotos = false;

function fmtDateTime(dtStr){
  if(!dtStr) return {main:'-', sub:''};
  const d = new Date(dtStr);
  if(isNaN(d)) return {main:'-', sub:''};
  const days = ['일','월','화','수','목','금','토'];
  const y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
  const h = d.getHours();
  const min = String(d.getMinutes()).padStart(2,'0');
  const ampm = h < 12 ? '오전' : '오후';
  const h12 = (h % 12) === 0 ? 12 : (h % 12);
  return {
    main: `${y}년 ${m}월 ${day}일 ${days[d.getDay()]}요일`,
    sub: `${ampm} ${h12}시${min !== '00' ? ' ' + min + '분' : ''}`
  };
}
const DEFAULT_BLOCKS = [
  {type:'photos'}, {type:'eyebrow', text:'WE ARE GETTING MARRIED'}, {type:'names'},
  {type:'text', text:''}, {type:'divider'}, {type:'datetime'}, {type:'venue'}
];

// 표시할 시안 결정: ?d=ID → 대표 시안 → 구버전(평면) 문서
function pickDraft(){
  const data = invData || {};
  const drafts = data.drafts || {};
  const ids = Object.keys(drafts);
  if(ids.length){
    const id = (wantedId && drafts[wantedId]) ? wantedId : (drafts[data.activeId] ? data.activeId : ids[0]);
    const d = drafts[id];
    return { id, d, blocks: (d.blocks && d.blocks.length) ? d.blocks : DEFAULT_BLOCKS };
  }
  const blocks = DEFAULT_BLOCKS.map(b => b.type === 'text' ? {type:'text', text:data.phrase || ''} : b);
  return { id:'main', d:data, blocks };
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function naverMapUrl(d){
  const q = (d.mapQuery || d.venueAddress || d.venueName || '').trim();
  return q ? 'https://map.naver.com/p/search/' + encodeURIComponent(q) : '';
}

function buildCarousel(list){
  const wrap = el('div', 'carousel');
  const track = el('div', 'carousel-track');
  const dots = el('div', 'carousel-dots');
  wrap.appendChild(track);
  const idxOf = () => Math.round(track.scrollLeft / (track.clientWidth || 1));
  const go = i => track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
  if(!list.length){
    track.appendChild(el('div', 'carousel-empty', '사진 준비 중'));
  }else{
    list.forEach((p, i) => {
      const slide = el('div', 'carousel-slide');
      const img = document.createElement('img');
      img.src = p.image;
      slide.appendChild(img);
      track.appendChild(slide);
      if(list.length > 1){
        const dot = el('span', 'carousel-dot' + (i===0 ? ' active' : ''));
        dot.style.cursor = 'pointer';
        dot.addEventListener('click', () => go(i));
        dots.appendChild(dot);
      }
    });
  }
  if(list.length > 1){
    const prev = el('button', 'carousel-arrow prev', '‹'); prev.setAttribute('aria-label','이전 사진');
    const next = el('button', 'carousel-arrow next', '›'); next.setAttribute('aria-label','다음 사진');
    prev.addEventListener('click', () => go(Math.max(0, idxOf()-1)));
    next.addEventListener('click', () => go(Math.min(track.children.length-1, idxOf()+1)));
    wrap.appendChild(prev); wrap.appendChild(next);
  }
  wrap.appendChild(dots);
  track.addEventListener('scroll', () => {
    const i = idxOf();
    Array.from(dots.children).forEach((d,k) => d.classList.toggle('active', k===i));
  });
  let dragging = false, sx = 0, ss = 0;
  track.addEventListener('pointerdown', ev => {
    if(ev.pointerType === 'touch') return;
    dragging = true; sx = ev.clientX; ss = track.scrollLeft;
    track.setPointerCapture(ev.pointerId);
    track.style.scrollSnapType = 'none';
  });
  track.addEventListener('pointermove', ev => { if(dragging) track.scrollLeft = ss - (ev.clientX - sx); });
  const end = () => {
    if(!dragging) return;
    dragging = false;
    track.style.scrollSnapType = 'x mandatory';
    go(Math.max(0, Math.min(track.children.length-1, idxOf())));
  };
  track.addEventListener('pointerup', end);
  track.addEventListener('pointerleave', end);
  return wrap;
}

function setMeta(attr, key, val){
  let m = document.head.querySelector(`meta[${attr}="${key}"]`);
  if(!val){ if(m) m.remove(); return; }
  if(!m){ m = document.createElement('meta'); m.setAttribute(attr, key); document.head.appendChild(m); }
  m.setAttribute('content', val);
}
// 브라우저 탭 제목 등 (※ 카카오톡 등 크롤러는 위 OG-START~OG-END 정적 태그만 읽음)
function applyMeta(d){
  const f = (d.ogImage || '').trim();
  const title = (d.ogTitle || '').trim() || ((d.groomName && d.brideName) ? `${d.groomName} ♥ ${d.brideName} 결혼합니다` : '');
  const t = fmtDateTime(d.weddingDateTime);
  const desc = (d.ogDescription || '').trim() || [t.main !== '-' ? (t.main + ' ' + t.sub).trim() : '', d.venueName].filter(Boolean).join(' · ');
  if(title){ document.title = title; setMeta('property','og:title', title); }
  if(desc){ setMeta('name','description', desc); setMeta('property','og:description', desc); }
  if(f){ try{ setMeta('property','og:image', new URL(f, location.href).href); }catch(e){} }
}

function render(){
  if(!gotInv || !gotPhotos) return;
  const { id, d, blocks } = pickDraft();
  applyMeta(d);
  const list = photos.filter(p => (p.inviteId || 'main') === id);
  const card = $('#card'), content = $('#content');
  // 사진 블록은 카드 맨 위(content 바깥)에 있으면 전체 폭으로 보이도록 처리
  Array.from(card.querySelectorAll('.carousel')).forEach(n => n.remove());
  content.innerHTML = '';
  let cur = content;
  blocks.forEach((b, i) => {
    if(b.type === 'photos'){
      const c = buildCarousel(list);
      // 내용이 이미 있으면 그 자리에서 content를 나눠 사진을 중간에 끼움
      if(content.childNodes.length === 0 && i === 0){ card.insertBefore(c, content); }
      else{ c.style.margin = '0 -30px 26px'; content.appendChild(c); }
      return;
    }
    if(b.type === 'eyebrow') content.appendChild(el('p', 'eyebrow', b.text || ''));
    else if(b.type === 'heading') content.appendChild(el('h2', 'heading', b.text || ''));
    else if(b.type === 'text') content.appendChild(el('p', 'phrase', b.text || ''));
    else if(b.type === 'divider') content.appendChild(el('div', 'divider'));
    else if(b.type === 'names'){
      const h = el('h1', 'names');
      h.appendChild(document.createTextNode(d.groomName || '신랑'));
      h.appendChild(el('span', 'amp', '·'));
      h.appendChild(document.createTextNode(d.brideName || '신부'));
      content.appendChild(h);
    }else if(b.type === 'datetime'){
      const dt = fmtDateTime(d.weddingDateTime);
      content.appendChild(el('p', 'datetime', dt.main));
      content.appendChild(el('p', 'datetime-sub', dt.sub));
    }else if(b.type === 'venue'){
      if(d.venueName) content.appendChild(el('p', 'venue-name', d.venueName));
      if(d.venueAddress) content.appendChild(el('p', 'venue-address', d.venueAddress));
      const url = naverMapUrl(d);
      const acts = el('div', 'map-actions');
      if(url){
        const a = el('a', 'map-btn primary', '네이버지도로 보기');
        a.href = url; a.target = '_blank'; a.rel = 'noopener';
        acts.appendChild(a);
      }
      if(d.venueAddress){
        const cp = el('button', 'map-btn', '주소 복사');
        cp.addEventListener('click', async () => {
          try{ await navigator.clipboard.writeText(d.venueAddress); cp.textContent = '복사됨 ✓'; }
          catch(e){ cp.textContent = d.venueAddress; }
          setTimeout(() => { cp.textContent = '주소 복사'; }, 1800);
        });
        acts.appendChild(cp);
      }
      if(acts.childNodes.length) content.appendChild(acts);
    }
  });
  $('#loadingState').style.display = 'none';
  card.style.display = 'block';
}

onSnapshot(invitationRef, snap => { invData = snap.exists() ? snap.data() : {}; gotInv = true; render(); });
onSnapshot(photosCol, snap => {
  photos = snap.docs.map(x => x.data()).sort((a,b)=> (a.order||0)-(b.order||0));
  gotPhotos = true; render();
});
</script>
</body>
</html>
