<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#1976D2;
    --primary-dark:#115293;
    --primary-light:#E3F2FD;
    --bg:#FAFAFA;
    --surface:#FFFFFF;
    --border:#E0E0E0;
    --divider:#EEEEEE;
    --header-fill:#F5F5F5;
    --text:#212121;
    --text-secondary:#757575;
    --success:#2E7D32; --success-bg:#E8F5E9;
    --warning:#EF6C00; --warning-bg:#FFF3E0;
    --error:#C62828; --error-bg:#FFEBEE;
    --info:#1565C0; --info-bg:#E3F2FD;
    --shadow:0 1px 2px rgba(0,0,0,0.12), 0 1px 1px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Roboto','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  button, input, textarea{ font-family:inherit; }

  /* ---------- App bar ---------- */
  .appbar{ background:var(--surface); border-bottom:1px solid var(--border); }
  .appbar-inner{
    max-width:1000px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; justify-content:space-between;
  }
  .appbar-title{ font-weight:700; font-size:16px; color:var(--text); }
  .appbar-right{ display:flex; align-items:center; gap:14px; }
  .user-email{ font-size:12.5px; color:var(--text-secondary); }
  .text-btn{
    background:none; border:none; color:var(--primary); font-size:13px; cursor:pointer; padding:4px 6px;
  }
  .text-btn:hover{ text-decoration:underline; }

  .wrap{ max-width:1000px; margin:0 auto; padding:20px 20px 70px; }

  /* ---------- Login ---------- */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:20px;
  }
  .login-card{
    background:var(--surface); border:1px solid var(--border); border-radius:4px; box-shadow:var(--shadow);
    padding:32px 30px; width:100%; max-width:360px;
  }
  .login-title{ font-weight:700; font-size:18px; margin-bottom:4px; }
  .login-sub{ font-size:12.5px; color:var(--text-secondary); margin-bottom:20px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--text-secondary); margin-bottom:5px; }
  .field input, .field textarea{
    width:100%; font-size:14px; padding:9px 11px; border:1px solid var(--border); border-radius:4px;
    background:#fff; color:var(--text);
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-light); }
  .login-error{ font-size:12.5px; color:var(--error); margin:-4px 0 12px; min-height:16px; }
  .btn-primary{
    background:var(--primary); color:#fff; border:none; padding:10px 16px; border-radius:4px;
    font-size:13.5px; font-weight:500; cursor:pointer;
  }
  .btn-primary:hover{ background:var(--primary-dark); }
  .full-width{ width:100%; }
  .btn-ghost{
    background:none; border:1px solid var(--border); color:var(--text-secondary); padding:8px 14px;
    border-radius:4px; cursor:pointer; font-size:13px;
  }
  .btn-ghost:hover{ border-color:var(--primary); color:var(--primary); }

  /* ---------- Summary block ---------- */
  .block{ background:var(--surface); border:1px solid var(--border); border-radius:4px; box-shadow:var(--shadow); }
  .summary-block{ padding:18px 22px; margin-bottom:16px; }
  .summary-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .wedding-date-row{ font-size:13.5px; color:var(--text-secondary); }
  .wedding-date-row b{ color:var(--text); font-weight:500; }
  .date-edit-btn{
    border:1px solid var(--border); background:#fff; color:var(--text-secondary);
    font-size:12px; padding:4px 10px; border-radius:4px; cursor:pointer; margin-left:6px;
  }
  .date-edit-btn:hover{ border-color:var(--primary); color:var(--primary); }
  .dday-number{ font-weight:700; font-size:34px; color:var(--primary); line-height:1; }
  .date-edit-row{ display:none; align-items:center; gap:8px; margin-top:10px; }
  .date-edit-row.open{ display:flex; }
  .date-edit-row input[type=date]{
    font-size:13.5px; padding:6px 9px; border:1px solid var(--border); border-radius:4px; background:#fff;
  }

  .now-banner{
    margin-top:16px; padding:11px 14px; background:var(--info-bg); border-left:3px solid var(--primary);
    border-radius:2px; font-size:13px;
  }
  .now-banner .now-label{ font-weight:500; color:var(--primary); font-size:11.5px; margin-bottom:2px; }
  .now-banner.done-state{ background:var(--success-bg); border-left-color:var(--success); }
  .now-banner.done-state .now-label{ color:var(--success); }
  .now-banner .now-sub{ color:var(--text-secondary); font-size:12.5px; margin-top:2px; }

  /* ---------- Tabs ---------- */
  .tabs{ display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .tab-btn{
    font-weight:500; font-size:14px; background:none; border:none; padding:11px 18px; cursor:pointer;
    color:var(--text-secondary); border-bottom:2px solid transparent;
  }
  .tab-btn.active{ color:var(--primary); border-bottom-color:var(--primary); }
  .panel{ display:none; }
  .panel.active{ display:block; }

  /* ---------- Step blocks / sheet tables ---------- */
  .step-block{ margin-bottom:14px; overflow:hidden; }
  .step-bar{
    display:flex; align-items:center; gap:10px; background:var(--header-fill); border-bottom:1px solid var(--border);
    padding:9px 14px; cursor:pointer; user-select:none; flex-wrap:wrap;
  }
  .outline-toggle{
    width:18px; height:18px; flex:0 0 auto; border:1px solid #BDBDBD; background:#fff; border-radius:2px;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:#616161;
  }
  .step-title{ font-weight:500; font-size:13.5px; color:var(--text); }
  .step-when{ font-size:12px; color:var(--text-secondary); }
  .step-num{ font-size:12px; color:var(--text-secondary); font-weight:500; flex:0 0 auto; }
  .step-name-input{
    border:none; background:transparent; font-weight:500; font-size:13.5px; color:var(--text);
    padding:3px 5px; border-radius:3px; width:170px; min-width:90px;
  }
  .step-name-input:focus{ outline:2px solid var(--primary); outline-offset:-2px; background:#fff; }
  .step-when-edit{ font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:3px; white-space:nowrap; }
  .step-months-input{
    width:42px; border:none; background:transparent; font:inherit; color:var(--text-secondary); text-align:center;
    padding:2px; border-radius:3px;
  }
  .step-months-input:focus{ outline:2px solid var(--primary); outline-offset:-2px; background:#fff; color:var(--text); }
  .step-duedate-input{
    border:none; background:transparent; font:inherit; color:var(--text-secondary);
    padding:2px 3px; border-radius:3px;
  }
  .step-duedate-input:focus{ outline:2px solid var(--primary); outline-offset:-2px; background:#fff; color:var(--text); }
  .step-dday-badge{ font-weight:700; color:var(--primary); font-size:12.5px; }
  .step-when-sep{ color:var(--border); }
  .step-del-btn{
    background:none; border:none; color:#BDBDBD; font-size:14px; cursor:pointer; padding:2px 5px; flex:0 0 auto;
  }
  .step-del-btn:hover{ color:var(--error); }
  .add-item-row td{ padding:8px 10px; background:#FAFAFA; }
  .del-item-cell{ text-align:center; width:30px; }
  .name-done-input{ text-decoration:line-through; color:var(--text-secondary); }
  .step-bar-spacer{ flex:1 1 auto; }
  .chip{ font-size:11px; font-weight:500; padding:3px 9px; border-radius:10px; white-space:nowrap; }
  .chip-done{ background:var(--success-bg); color:var(--success); }
  .chip-current{ background:var(--info-bg); color:var(--info); }
  .chip-upcoming{ background:#EEEEEE; color:var(--text-secondary); }
  .chip-overdue{ background:var(--error-bg); color:var(--error); }
  .chip-unpaid{ background:var(--error-bg); color:var(--error); }
  .chip-deposit{ background:var(--warning-bg); color:var(--warning); }
  .chip-interim{ background:var(--info-bg); color:var(--info); }
  .chip-paid{ background:var(--success-bg); color:var(--success); }
  .progress-mini{ font-size:12px; color:var(--text-secondary); min-width:38px; text-align:right; }
  .spend-mini{ font-size:12px; color:var(--primary); font-weight:500; }

  .step-body{ display:none; }
  .step-block.open .step-body{ display:block; }

  .table-scroll{ overflow-x:auto; }
  table.sheet{ width:100%; min-width:760px; border-collapse:collapse; font-size:12.8px; }
  table.sheet th{
    background:#FAFAFA; border:1px solid var(--border); padding:7px 10px; text-align:left;
    font-weight:500; color:var(--text-secondary); white-space:nowrap; position:sticky; top:0;
  }
  table.sheet td{ border:1px solid var(--border); padding:0; vertical-align:middle; background:#fff; }
  table.sheet tbody tr:hover td{ background:#FAFAFA; }
  table.sheet td.static-cell{ padding:7px 10px; color:var(--text); }
  table.sheet td.static-cell.muted{ color:var(--text-secondary); }
  table.sheet td .cell-input{
    width:100%; border:none; background:transparent; padding:7px 10px; font:inherit; color:var(--text);
  }
  table.sheet td .cell-input:focus{ outline:2px solid var(--primary); outline-offset:-2px; background:var(--primary-light); }
  .check-cell{ text-align:center; width:34px; }
  .item-check{
    width:16px; height:16px; cursor:pointer; accent-color:var(--primary); vertical-align:middle;
  }
  .name-done{ text-decoration:line-through; color:var(--text-secondary); }

  .exp-link-cell{ padding:5px 8px; }
  .exp-link-empty-btn{
    background:none; border:1px dashed #B0BEC5; color:var(--primary); font-size:11.5px; padding:4px 8px;
    border-radius:4px; cursor:pointer; white-space:nowrap;
  }
  .exp-link-empty-btn:hover{ background:var(--primary-light); }
  .exp-link-filled{ font-size:11.5px; display:flex; flex-direction:column; gap:3px; }
  .exp-link-filled .amt{ font-weight:500; color:var(--primary); }
  .exp-link-filled .lbtns{ display:flex; gap:8px; }
  .exp-link-filled .lbtns button{
    background:none; border:none; color:var(--text-secondary); font-size:11px; cursor:pointer; padding:0;
  }
  .exp-link-filled .lbtns button:hover{ color:var(--primary); text-decoration:underline; }
  .exp-link-filled .lbtns button.unlink:hover{ color:var(--error); }

  /* ---------- Expense sheet ---------- */
  .exp-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .exp-toolbar h3{ font-size:14.5px; font-weight:500; margin:0; }

  .summary-strip{ display:flex; border:1px solid var(--border); border-radius:4px; overflow:hidden; margin-bottom:18px; background:#fff; }
  .summary-cell{ flex:1; padding:13px 16px; border-right:1px solid var(--border); }
  .summary-cell:last-child{ border-right:none; }
  .summary-cell .label{ font-size:11.5px; color:var(--text-secondary); }
  .summary-cell .value{ font-weight:700; font-size:18px; margin-top:3px; }
  .summary-cell.accent .value{ color:var(--primary); }
  .summary-cell.warn .value{ color:var(--error); }

  table.exp-sheet{ width:100%; min-width:1080px; border-collapse:collapse; font-size:12.8px; }
  table.exp-sheet th{
    background:#FAFAFA; border:1px solid var(--border); padding:7px 10px; text-align:left; font-weight:500; color:var(--text-secondary); white-space:nowrap;
  }
  table.exp-sheet td{ border:1px solid var(--border); padding:0; vertical-align:middle; background:#fff; }
  table.exp-sheet tbody tr:hover td{ background:#FAFAFA; }
  table.exp-sheet td .cell-input{
    width:100%; border:none; background:transparent; padding:7px 9px; font:inherit; color:var(--text);
  }
  table.exp-sheet td .cell-input:focus{ outline:2px solid var(--primary); outline-offset:-2px; background:var(--primary-light); }
  table.exp-sheet td.num .cell-input{ text-align:right; }
  table.exp-sheet td.status-cell{ padding:6px 8px; text-align:center; }
  table.exp-sheet td.link-cell{ padding:6px 8px; font-size:11.5px; color:var(--text-secondary); }
  table.exp-sheet td.del-cell{ text-align:center; width:36px; }
  .del-icon-btn{
    background:none; border:none; color:#BDBDBD; font-size:15px; cursor:pointer; padding:4px;
  }
  .del-icon-btn:hover{ color:var(--error); }

  .add-row-btn{
    background:none; border:1px dashed #B0BEC5; color:var(--primary); font-size:12.5px; padding:7px 12px;
    border-radius:4px; cursor:pointer; margin-top:10px;
  }
  .add-row-btn:hover{ background:var(--primary-light); }

  .empty-note{ text-align:center; color:var(--text-secondary); font-size:13px; padding:30px 10px; border:1px dashed var(--border); border-radius:4px; }

  /* ---------- 시안(무드보드) ---------- */
  .mb-tabbar{ display:flex; align-items:flex-end; gap:4px; flex-wrap:wrap; }
  .mb-tab{
    font-size:12.5px; padding:7px 10px; border-radius:4px 4px 0 0; cursor:pointer;
    border:1px solid var(--border); border-bottom:none; background:var(--header-fill);
    color:var(--text-secondary); display:flex; align-items:center; gap:6px;
  }
  .mb-tab.active{ background:var(--surface); color:var(--text); font-weight:500; }
  .mb-tab-x{ width:14px; height:14px; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:10px; color:var(--text-secondary); }
  .mb-tab-x:hover{ background:var(--error-bg); color:var(--error); }
  .mb-tab-add{ font-weight:700; }
  .mb-tab-name-input{ font-size:12.5px; border:none; background:transparent; width:74px; font:inherit; color:var(--text); }
  .mb-tab-name-input:focus{ outline:2px solid var(--primary); outline-offset:-2px; background:#fff; }
  .mb-panel{ padding:16px; border-radius:0 4px 4px 4px; }
  .mb-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .mb-toolbar .hint{ font-size:12.5px; color:var(--text-secondary); }
  .mb-sec-ctrl{ display:flex; align-items:center; gap:6px; }
  .mb-sec-ctrl button{ padding:4px 9px; font-size:13px; }
  .mb-sec-ctrl span{ font-size:12px; color:var(--text-secondary); min-width:52px; text-align:center; display:inline-block; }
  .mb-board-frame{ width:100%; max-width:820px; aspect-ratio:297/210; margin:0 auto; }
  .mb-board-row{ display:flex; flex-direction:row; gap:12px; height:100%; }
  .mb-col{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:4px; height:100%; }
  .mb-title-input{
    width:100%; box-sizing:border-box; border:none; background:transparent; font-size:13px;
    font-weight:500; padding:3px 4px; color:var(--text); flex:0 0 22px; border-radius:3px;
  }
  .mb-title-input:focus{ outline:2px solid var(--primary); outline-offset:-2px; background:#fff; }
  .mb-sub-row{ flex:2 1 0; min-height:0; display:flex; flex-direction:row; gap:4px; }
  .mb-slot{
    position:relative; width:100%; height:100%; border:1px solid var(--border); border-radius:4px;
    overflow:hidden; background:#FAFAFA; cursor:pointer; box-sizing:border-box; min-width:0; min-height:0;
  }
  .mb-slot.selected{ border:2px solid var(--primary); }
  .mb-slot.dragover{ border-color:var(--primary); background:var(--primary-light); }
  .mb-photo{ width:100%; height:100%; object-fit:cover; display:block; }
  .mb-placeholder{
    display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;
    color:var(--text-secondary); gap:2px; font-size:10.5px; text-align:center; padding:0 4px;
  }
  .mb-remove{
    position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:50%;
    background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0; font-size:10px; color:var(--text-secondary); line-height:1;
  }
  .mb-remove:hover{ color:var(--error); border-color:var(--error-bg); }
  .mb-kb-tag{
    position:absolute; bottom:2px; left:2px; font-size:9px; background:rgba(255,255,255,0.9);
    padding:1px 4px; border-radius:3px; color:var(--text-secondary);
  }
  .mb-caption{
    width:100%; height:100%; box-sizing:border-box; resize:none; border:1px solid var(--border);
    border-radius:4px; padding:6px 8px; font:inherit; font-size:12px; background:#fff; color:var(--text);
  }
  .mb-caption:focus{ outline:none; border-color:var(--primary); }

  footer{ text-align:center; font-size:11px; color:var(--text-secondary); margin-top:30px; }

  @media (max-width:640px){
    .dday-number{ font-size:28px; }
    .summary-strip{ flex-wrap:wrap; }
    .summary-cell{ flex:1 1 50%; border-bottom:1px solid var(--border); }
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-title">Wedding Log</div>
    <div class="login-sub">등록된 계정으로 로그인하세요</div>
    <div class="field">
      <label>이메일</label>
      <input type="email" id="loginEmail" autocomplete="username">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="btn-primary full-width" id="loginBtn">로그인</button>
  </div>
</div>

<div id="appRoot" style="display:none;">
  <div class="appbar">
    <div class="appbar-inner">
      <span class="appbar-title">Wedding Log</span>
      <div class="appbar-right">
        <span class="user-email" id="userEmail"></span>
        <button class="text-btn" id="logoutBtn">로그아웃</button>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="block summary-block">
      <div class="summary-top">
        <div>
          <div class="wedding-date-row">
            예식일 <b id="weddingDateText">-</b>
            <button class="date-edit-btn" id="editDateBtn">날짜 수정</button>
          </div>
          <div class="date-edit-row" id="dateEditRow">
            <input type="date" id="weddingDateInput">
            <button class="btn-primary" id="saveDateBtn" style="padding:6px 12px;font-size:12.5px;">저장</button>
          </div>
        </div>
        <div class="dday-number" id="ddayNumber">D-0</div>
      </div>
      <div class="now-banner" id="nowBanner">
        <div class="now-label" id="nowLabel">지금 할 일</div>
        <div id="nowStepName">불러오는 중...</div>
        <div class="now-sub" id="nowStepSub"></div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="timeline">타임라인 · 체크리스트</button>
      <button class="tab-btn" data-tab="expenses">지출 장부</button>
      <button class="tab-btn" data-tab="moodboard">시안</button>
    </div>

    <div class="panel active" id="panel-timeline">
      <div id="timelineList"></div>
      <button class="add-row-btn" id="addStepBtn">+ 새 단계 추가</button>
    </div>

    <div class="panel" id="panel-expenses">
      <div class="summary-strip" id="expSummary"></div>
      <div class="exp-toolbar">
        <h3>지출 내역</h3>
      </div>
      <div class="table-scroll">
        <table class="exp-sheet" id="expTable" style="display:none;">
          <thead>
            <tr>
              <th>날짜</th><th>항목</th><th>업체</th><th>총금액</th><th>계약금</th><th>중도금</th><th>잔금</th>
              <th>상태</th><th>메모</th><th>연결됨</th><th></th>
            </tr>
          </thead>
          <tbody id="expTableBody"></tbody>
        </table>
      </div>
      <div class="empty-note" id="expEmptyNote" style="display:none;">아직 등록된 지출이 없어요. 아래 버튼이나 타임라인의 각 항목에서 지출을 기록해보세요.</div>
      <button class="add-row-btn" id="addExpRowBtn">+ 새 지출 행 추가</button>
    </div>

    <div class="panel" id="panel-moodboard">
      <div class="mb-tabbar" id="mbTabBar"></div>
      <div class="mb-panel block">
        <div class="mb-toolbar">
          <span class="hint">사진 칸을 클릭해 선택한 뒤 드래그하거나 Ctrl+V로 붙여넣으세요 · 보드 이름은 더블클릭해서 수정</span>
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <div class="mb-sec-ctrl">
              <button id="mbSecMinus" class="btn-ghost">－</button>
              <span id="mbSecCount">3개 섹션</span>
              <button id="mbSecPlus" class="btn-ghost">＋</button>
            </div>
            <button id="mbClearBtn" class="btn-ghost">이 보드 지우기</button>
          </div>
        </div>
        <div class="mb-board-frame">
          <div class="mb-board-row" id="mbBoardRow"></div>
        </div>
      </div>
    </div>

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function compressImage(fileOrBlob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 700;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const url = canvas.toDataURL('image/jpeg', 0.65);
        const kb = Math.round((url.length * 0.75) / 1024);
        resolve({url, kb});
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(fileOrBlob);
  });
}
function fmtWon(n){ n = Number(n)||0; return n.toLocaleString('ko-KR') + '원'; }
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function subtractMonths(dateObj, months){
  const d = new Date(dateObj);
  const whole = Math.floor(months);
  const frac = months - whole;
  d.setMonth(d.getMonth() - whole);
  if(frac) d.setDate(d.getDate() - Math.round(frac*30));
  return d;
}
function daysBetween(a,b){
  const MS = 86400000;
  const da = new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const db2 = new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((db2-da)/MS);
}

function findItem(stepId, itemId){

}
function stepShortTitle(step){ return step.name; }
function monthsBeforeLabel(m){
  m = Number(m)||0;
  if(m <= 0) return 'D-DAY';
  const y = Math.floor(m/12);
  const rem = Math.round((m - y*12)*10)/10;
  let label = 'D-';
  if(y>0) label += `${y}년 `;
  if(rem>0 || y===0) label += `${rem}개월`;
  return label.trim();
}

function renderHero(){

  const wDate = new Date(weddingDate + 'T00:00:00');

  $('#weddingDateText').textContent = fmtDate(weddingDate) + ' (' + ['일','월','화','수','목','금','토'][wDate.getDay()] + ')';

  const ddayEl = $('#ddayNumber');
  if(diff > 0) ddayEl.textContent = 'D-' + diff;
  else if(diff === 0) ddayEl.textContent = 'D-DAY';
  else ddayEl.textContent = 'D+' + Math.abs(diff);

  const banner = $('#nowBanner');
  if(diff <= 0){
    banner.classList.add('done-state');
    $('#nowLabel').textContent = diff===0 ? '오늘' : '완료';
    $('#nowStepName').textContent = diff===0 ? '오늘이 바로 그 날이에요.' : '결혼을 축하드려요. 즐거운 신혼 되세요.';
    $('#nowStepSub').textContent = '';
    return;
  }
  banner.classList.remove('done-state');

  const stepDates = steps.map(s => subtractMonths(wDate, s.monthsBefore));
  let currentIdx = stepDates.findIndex(d => d >= today);
  if(currentIdx === -1) currentIdx = steps.length - 1;
  const cur = steps[currentIdx];
  const remain = cur.items.filter(i=>!i.done).length;

  $('#nowLabel').textContent = '지금 할 일';
  $('#nowStepName').textContent = `${stepShortTitle(cur)} — ${cur.desc}`;
  $('#nowStepSub').textContent = remain > 0
    ? `${monthsBeforeLabel(cur.monthsBefore)} 단계 · 남은 항목 ${remain}개`
    : `${monthsBeforeLabel(cur.monthsBefore)} 단계 · 이 단계는 모두 완료했어요`;
}

/* ============ 렌더: 타임라인 ============ */
function stepStatus(step, wDate, today){
  const dueDate = subtractMonths(wDate, step.monthsBefore);
  const total = step.items.length;
  const done = step.items.filter(i=>i.done).length;
  const allDone = total>0 && done===total;
  const passed = dueDate < today;
  let status = 'upcoming';
  if(allDone) status = 'done';
  else if(passed) status = 'overdue';
  return {dueDate, total, done, allDone, passed, status};
}

function paymentStatus(e){
  const total = Number(e.total)||0;
  const paid = (Number(e.deposit)||0) + (Number(e.interim)||0) + (Number(e.balance)||0);
  if(paid <= 0) return {label:'미납', cls:'chip-unpaid'};
  if(total > 0 && paid >= total) return {label:'잔금완납', cls:'chip-paid'};
  if(Number(e.interim) > 0) return {label:'중도금 납부', cls:'chip-interim'};
  return {label:'계약금만 납부', cls:'chip-deposit'};
}

      tr.querySelector('.f-desc').addEventListener('change', e => { item.desc = e.target.value; saveChecklist(); });
      tr.querySelector('.f-vendor').addEventListener('change', e => { item.vendor = e.target.value; saveChecklist(); });
      tr.querySelector('.f-phone').addEventListener('change', e => { item.phone = e.target.value; saveChecklist(); });
      tr.querySelector('.f-donedate').addEventListener('change', e => { item.doneDate = e.target.value; saveChecklist(); });

        if(exp){ exp.linkedStepId = null; exp.linkedItemId = null; }
        item.expenseId = null;
        saveChecklist();
        saveExpenses();

    });

    monthsInput.addEventListener('click', ev => ev.stopPropagation());
    monthsInput.addEventListener('focus', function(){ this.select(); });
    monthsInput.addEventListener('change', ev => {
      const v = parseFloat(ev.target.value);
      s.monthsBefore = isNaN(v) ? 0 : v;
      forceOpenStepId = s.id;
      sortStepsByDate();
      saveChecklist();
    });

    const dueDateInput = block.querySelector('.step-duedate-input');
    dueDateInput.addEventListener('click', ev => ev.stopPropagation());
    dueDateInput.addEventListener('change', ev => {
      const picked = ev.target.value;
      if(!picked) return;
      const wD = new Date(weddingDate + 'T00:00:00');
      const pD = new Date(picked + 'T00:00:00');
      const days = daysBetween(pD, wD);
      s.monthsBefore = Math.round((days/30.4368)*10)/10;
      forceOpenStepId = s.id;
      sortStepsByDate();
      saveChecklist();
    });

    block.querySelector('.step-del-btn').addEventListener('click', (ev) => {
      ev.stopPropagation();
      if(confirm(`'${s.name||'이 단계'}' 전체를 삭제할까요? 이 단계의 모든 항목이 함께 삭제돼요.`)){
        s.items.forEach(item => {
          if(item.expenseId){
            const exp = findExpense(item.expenseId);
            if(exp){ exp.linkedStepId = null; exp.linkedItemId = null; }
          }
        });
        steps = steps.filter(x => x.id !== s.id);
        saveChecklist();
        saveExpenses();
      }
    });

    block.querySelector('.step-bar').addEventListener('click', () => {
      block.classList.toggle('open');
      block.querySelector('.outline-toggle').textContent = block.classList.contains('open') ? '−' : '+';
    });

    container.appendChild(block);
  });

  forceOpenStepId = null;
}

function renderExpSummary(){
  const totalBudget = expenses.reduce((sum,e)=> sum + (Number(e.total)||0), 0);
  const totalPaid = expenses.reduce((sum,e)=> sum + (Number(e.deposit)||0)+(Number(e.interim)||0)+(Number(e.balance)||0), 0);
  const remaining = totalBudget - totalPaid;
  const unpaidCount = expenses.filter(e => paymentStatus(e).label !== '잔금완납').length;

  $('#expSummary').innerHTML = `
    <div class="summary-cell"><div class="label">총 예산 합계</div><div class="value">${fmtWon(totalBudget)}</div></div>
    <div class="summary-cell accent"><div class="label">지금까지 납부액</div><div class="value">${fmtWon(totalPaid)}</div></div>
    <div class="summary-cell warn"><div class="label">남은 잔액</div><div class="value">${fmtWon(Math.max(remaining,0))}</div></div>
    <div class="summary-cell"><div class="label">미완납 건수</div><div class="value">${unpaidCount}건</div></div>
  `;
}

function renderExpList(){
  const tbody = $('#expTableBody');
  const table = $('#expTable');
  const emptyNote = $('#expEmptyNote');
  tbody.innerHTML = '';

  if(expenses.length === 0){
    table.style.display = 'none';
    emptyNote.style.display = 'block';
    return;
  }
  table.style.display = '';
  emptyNote.style.display = 'none';

  const sorted = [...expenses].sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  sorted.forEach(e => {
    const status = paymentStatus(e);
    const tr = document.createElement('tr');
    tr.dataset.expId = e.id;

    let linkText = '-';
    if(e.linkedStepId!=null && e.linkedItemId!=null){
      const {step, item} = findItem(e.linkedStepId, e.linkedItemId);
      if(step && item) linkText = `${stepShortTitle(step)} · ${item.name}`;
    }

    tr.innerHTML = `
      <td><input type="date" class="cell-input p-date" value="${e.date||''}"></td>
      <td><input type="text" class="cell-input p-name" value="${e.name||''}" placeholder="항목명"></td>
      <td><input type="text" class="cell-input p-vendor" value="${e.vendor||''}" placeholder="업체명"></td>
      <td class="num"><input type="number" class="cell-input p-total" value="${e.total||''}" placeholder="0"></td>
      <td class="num"><input type="number" class="cell-input p-deposit" value="${e.deposit||''}" placeholder="0"></td>
      <td class="num"><input type="number" class="cell-input p-interim" value="${e.interim||''}" placeholder="0"></td>
      <td class="num"><input type="number" class="cell-input p-balance" value="${e.balance||''}" placeholder="0"></td>
      <td class="status-cell"><span class="chip ${status.cls}">${status.label}</span></td>
      <td><input type="text" class="cell-input p-memo" value="${e.memo||''}" placeholder="메모"></td>
      <td class="link-cell">${linkText}</td>
      <td class="del-cell"><button class="del-icon-btn" title="삭제">✕</button></td>
    `;

    tr.querySelector('.p-date').addEventListener('change', ev => { e.date = ev.target.value; saveExpenses(); });
    tr.querySelector('.p-name').addEventListener('change', ev => { e.name = ev.target.value; saveExpenses(); });
    tr.querySelector('.p-vendor').addEventListener('change', ev => { e.vendor = ev.target.value; saveExpenses(); });

    // 총금액은 직접 입력할 수도 있고, 비워두면(자동 모드) 계약금+중도금+잔금 합계를 자동으로 반영해요.
    const recalcTotalIfAuto = () => {
      if(e.totalAuto !== false){
        e.total = (Number(e.deposit)||0) + (Number(e.interim)||0) + (Number(e.balance)||0);
      }
    };
    tr.querySelector('.p-total').addEventListener('change', ev => {
      e.total = ev.target.value;
      e.totalAuto = false; // 사용자가 직접 총금액을 적으면 이후로는 자동 합산을 멈춤
      saveExpenses();
    });
    tr.querySelector('.p-deposit').addEventListener('change', ev => { e.deposit = ev.target.value; recalcTotalIfAuto(); saveExpenses(); });
    tr.querySelector('.p-interim').addEventListener('change', ev => { e.interim = ev.target.value; recalcTotalIfAuto(); saveExpenses(); });
    tr.querySelector('.p-balance').addEventListener('change', ev => { e.balance = ev.target.value; recalcTotalIfAuto(); saveExpenses(); });
    tr.querySelector('.p-memo').addEventListener('change', ev => { e.memo = ev.target.value; saveExpenses(); });

    // 숫자 칸에 포커스하면 기존 값이 전체 선택돼서, 바로 타이핑해도 앞에 0이 안 남아요.
    ['.p-total','.p-deposit','.p-interim','.p-balance'].forEach(sel => {
      tr.querySelector(sel).addEventListener('focus', function(){ this.select(); });
    });

    tr.querySelector('.del-icon-btn').addEventListener('click', () => {
      if(confirm(`'${e.name||'이 항목'}'을(를) 삭제할까요?`)){
        if(e.linkedStepId!=null && e.linkedItemId!=null){
          const {item} = findItem(e.linkedStepId, e.linkedItemId);
          if(item){ item.expenseId = null; saveChecklist(); }
        }
        expenses = expenses.filter(x => x.id !== e.id);
        saveExpenses();
      }
    });

    tbody.appendChild(tr);
  });
}

function addExpenseFromItem(step, item){
  const newExp = {
    id: uid(), name: item.name, vendor: item.vendor||'', date: todayStr(),
    total:0, deposit:0, interim:0, balance:0, memo:'', totalAuto:true,
    linkedStepId: step.id, linkedItemId: item.id
  };
  expenses.push(newExp);
  item.expenseId = newExp.id;
  saveChecklist();
  saveExpenses();
  pendingJumpExpId = newExp.id;
  switchTab('expenses');
}

function mbActiveBoard(){ return mbBoards.find(b => b.id === mbActiveBoardId) || null; }

function renderMbTabs(){
  const bar = $('#mbTabBar');
  bar.innerHTML = '';
  mbBoards.forEach(b => {
    const tab = document.createElement('div');
    tab.className = 'mb-tab' + (b.id === mbActiveBoardId ? ' active' : '');

    if(mbEditingBoardId === b.id){
      const nameInput = document.createElement('input');
      nameInput.className = 'mb-tab-name-input';
      nameInput.value = b.name;
      tab.appendChild(nameInput);
      const commit = () => {
        const v = nameInput.value.trim();
        if(v && v !== b.name){ b.name = v; saveMbBoard(b); }
        mbEditingBoardId = null;
        renderMbTabs();
      };
      nameInput.addEventListener('keydown', ev => {
        if(ev.key === 'Enter') commit();
        if(ev.key === 'Escape'){ mbEditingBoardId = null; renderMbTabs(); }
      });
      nameInput.addEventListener('blur', commit);
      nameInput.addEventListener('click', ev => ev.stopPropagation());
      setTimeout(() => { nameInput.focus(); nameInput.select(); }, 0);
    }else{
      const label = document.createElement('span');
      label.textContent = b.name;
      label.addEventListener('dblclick', ev => {
        ev.stopPropagation();
        mbEditingBoardId = b.id;
        renderMbTabs();
      });
      tab.appendChild(label);
    }

    if(mbBoards.length > 1){
      const x = document.createElement('span');
      x.className = 'mb-tab-x';
      x.textContent = '✕';
      x.title = '보드 삭제';
      x.addEventListener('click', ev => {
        ev.stopPropagation();
        if(confirm(`'${b.name}' 보드를 삭제할까요? 안의 사진과 설명도 함께 삭제돼요.`)){
          deleteMbBoard(b.id);
        }
      });
      tab.appendChild(x);
    }

    tab.addEventListener('click', () => {
      if(mbEditingBoardId === b.id) return;
      mbActiveBoardId = b.id;
      mbSelectedKey = null;
      renderMoodboard();
    });
    bar.appendChild(tab);
  });

  const addTab = document.createElement('div');
  addTab.className = 'mb-tab mb-tab-add';
  addTab.textContent = '+';
  addTab.title = '보드 추가';
  addTab.addEventListener('click', async () => {
    const board = createMbBoard(mbBoards.length);
    await saveMbBoard(board);
    const sections = [0,1,2].map(i => emptyMbSection(board.id, i));
    await Promise.all(sections.map(saveMbSection));
    mbActiveBoardId = board.id;
    mbSelectedKey = null;
  });
  bar.appendChild(addTab);
}

function mbGetSlotData(section, type, subIdx){
  return type === 'main' ? section.main : section.subs[subIdx];
}

function mbBuildSlot(section, type, subIdx, flexStyle){
  const key = type === 'main' ? (section.id+'-main') : (section.id+'-sub-'+subIdx);
  const data = mbGetSlotData(section, type, subIdx);
  const holder = document.createElement('div');
  holder.style.cssText = flexStyle + ';min-width:0;min-height:0;';

  const slot = document.createElement('div');
  slot.className = 'mb-slot' + (mbSelectedKey === key ? ' selected' : '');

  if(data.image){
    slot.innerHTML = `<img class="mb-photo" src="${data.image}">`;
  }else{
    const label = type === 'main' ? '메인 사진' : '';
    slot.innerHTML = `<div class="mb-placeholder">${label ? '<span>'+label+'</span>' : ''}<span>드래그 또는 Ctrl+V</span></div>`;
  }

  if(data.image && data.kb){
    const tag = document.createElement('span');
    tag.className = 'mb-kb-tag';
    tag.textContent = data.kb + 'KB';
    slot.appendChild(tag);
  }

  if(data.image){
    const removeBtn = document.createElement('button');
    removeBtn.className = 'mb-remove';
    removeBtn.title = '사진 삭제';
    removeBtn.textContent = '✕';
    removeBtn.addEventListener('click', ev => {
      ev.stopPropagation();
      data.image = null; data.kb = null;
      saveMbSection(section);
    });
    slot.appendChild(removeBtn);
  }

  slot.addEventListener('click', () => { mbSelectedKey = key; renderMbBoard(); });
  slot.addEventListener('dragover', ev => { ev.preventDefault(); slot.classList.add('dragover'); });
  slot.addEventListener('dragleave', () => slot.classList.remove('dragover'));
  slot.addEventListener('drop', ev => {
    ev.preventDefault();
    slot.classList.remove('dragover');
    const file = ev.dataTransfer.files && ev.dataTransfer.files[0];
    if(file && file.type.indexOf('image') === 0){
      compressImage(file).then(res => {
        data.image = res.url; data.kb = res.kb;
        mbSelectedKey = key;
        saveMbSection(section);
      });
    }
  });

  holder.appendChild(slot);
  return holder;
}

function renderMbBoard(){
  const board = mbActiveBoard();
  const row = $('#mbBoardRow');
  row.innerHTML = '';
  if(!board){ $('#mbSecCount').textContent = ''; return; }

  const sections = mbBoardSections(board.id);
  $('#mbSecCount').textContent = sections.length + '개 섹션';

  sections.forEach(section => {
    const col = document.createElement('div');
    col.className = 'mb-col';

    const titleInput = document.createElement('input');
    titleInput.className = 'mb-title-input';
    titleInput.placeholder = '예: 실내 컨셉 1';
    titleInput.value = section.title || '';
    titleInput.addEventListener('change', ev => {
      section.title = ev.target.value;
      saveMbSection(section);
    });
    col.appendChild(titleInput);

    col.appendChild(mbBuildSlot(section, 'main', null, 'flex:4 1 0'));

    const subRow = document.createElement('div');
    subRow.className = 'mb-sub-row';
    for(let i=0;i<3;i++){
      subRow.appendChild(mbBuildSlot(section, 'sub', i, 'flex:1 1 0'));
    }
    col.appendChild(subRow);

    const capHolder = document.createElement('div');
    capHolder.style.cssText = 'flex:1.3 1 0; min-height:0;';
    const cap = document.createElement('textarea');
    cap.className = 'mb-caption';
    cap.placeholder = '이 섹션 설명 입력';
    cap.value = section.caption || '';
    cap.addEventListener('change', ev => {
      section.caption = ev.target.value;
      saveMbSection(section);
    });
    capHolder.appendChild(cap);
    col.appendChild(capHolder);

    row.appendChild(col);
  });
}

function renderMoodboard(){
  renderMbTabs();
  renderMbBoard();
}

function bindMoodboard(){
  $('#mbSecMinus').addEventListener('click', () => {
    const board = mbActiveBoard();
    if(!board) return;
    const sections = mbBoardSections(board.id);
    if(sections.length > 2){
      deleteMbSection(sections[sections.length-1].id);
    }
  });
  $('#mbSecPlus').addEventListener('click', () => {
    const board = mbActiveBoard();
    if(!board) return;
    const sections = mbBoardSections(board.id);
    if(sections.length < 4){
      saveMbSection(emptyMbSection(board.id, sections.length));
    }
  });
  $('#mbClearBtn').addEventListener('click', () => {
    const board = mbActiveBoard();
    if(!board) return;
    if(confirm('이 보드의 사진과 설명을 모두 지울까요?')){
      mbBoardSections(board.id).forEach(s => {
        s.title=''; s.caption='';
        s.main = {image:null,kb:null};
        s.subs = [{image:null,kb:null},{image:null,kb:null},{image:null,kb:null}];
        saveMbSection(s);
      });
    }
  });
  document.addEventListener('paste', ev => {
    if(!mbSelectedKey) return;
    const mbPanel = $('#panel-moodboard');
    if(!mbPanel || !mbPanel.classList.contains('active')) return;
    const items = ev.clipboardData && ev.clipboardData.items;
    if(!items) return;
    for(let i=0;i<items.length;i++){
      const item = items[i];
      if(item.type.indexOf('image') === 0){
        const blob = item.getAsFile();
        const dashIdx = mbSelectedKey.indexOf('-');
        const sectionId = mbSelectedKey.slice(0, dashIdx);
        const rest = mbSelectedKey.slice(dashIdx+1);
        const section = mbSections.find(s => s.id === sectionId);
        if(!section) return;
        const type = rest.indexOf('sub') === 0 ? 'sub' : 'main';
        const subIdx = type === 'sub' ? parseInt(rest.split('-')[1]) : null;
        const data = mbGetSlotData(section, type, subIdx);
        compressImage(blob).then(res => {
          data.image = res.url; data.kb = res.kb;
          saveMbSection(section);
        });
        ev.preventDefault();
        break;
      }
    }
  });
}

function showApp(user){

  $('#appRoot').style.display = 'block';
  $('#userEmail').textContent = user.email || '';
  startListeners();
}
function showLogin(){
  unsubscribers.forEach(u => u());
  unsubscribers = [];
  steps = null; expenses = [];
  mbBoards = []; mbSections = []; mbActiveBoardId = null; mbSelectedKey = null; mbEditingBoardId = null; mbSeeded = false;
  $('#appRoot').style.display = 'none';
  $('#loginScreen').style.display = 'flex';
  $('#loginEmail').value = '';
  $('#loginPassword').value = '';
  $('#loginError').textContent = '';
}

/* ============ 초기화 ============ */
bindTabs();
bindDateEdit();
bindAddStep();
bindAddExpRow();
bindMoodboard();
bindAuth();

onAuthStateChanged(auth, (user) => {
  if(user) showApp(user);
  else showLogin();
});
</script>
</body>
</html>
