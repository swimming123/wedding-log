<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결혼 준비 타임라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#1976D2; --primary-light:#E3F2FD;
    --bg:#FAFAFA; --surface:#FFFFFF; --border:#E0E0E0; --header-fill:#F5F5F5;
    --text:#212121; --text-secondary:#757575;
    --success:#2E7D32; --success-bg:#E8F5E9;
    --error:#C62828; --error-bg:#FFEBEE;
    --info:#1565C0; --info-bg:#E3F2FD;
    --shadow:0 1px 2px rgba(0,0,0,0.12), 0 1px 1px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Roboto','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased; font-size:14px;
  }
  .appbar{ background:var(--surface); border-bottom:1px solid var(--border); }
  .appbar-inner{ max-width:820px; margin:0 auto; padding:12px 20px; }
  .appbar-title{ font-weight:700; font-size:16px; }
  .wrap{ max-width:820px; margin:0 auto; padding:20px 20px 60px; }
  .block{ background:var(--surface); border:1px solid var(--border); border-radius:4px; box-shadow:var(--shadow); }
  .summary-block{ padding:18px 22px; margin-bottom:16px; }
  .wedding-date-row{ font-size:13.5px; color:var(--text-secondary); }
  .wedding-date-row b{ color:var(--text); font-weight:500; }
  .dday-number{ font-weight:700; font-size:34px; color:var(--primary); line-height:1; margin-top:6px; }
  .step-block{ margin-bottom:14px; overflow:hidden; }
  .step-bar{
    display:flex; align-items:center; gap:10px; background:var(--header-fill); border-bottom:1px solid var(--border);
    padding:9px 14px; flex-wrap:wrap;
  }
  .step-title{ font-weight:500; font-size:13.5px; }
  .step-dday-badge{ font-weight:700; color:var(--primary); font-size:12.5px; }
  .step-when-sep{ color:var(--border); }
  .step-when{ font-size:12px; color:var(--text-secondary); }
  .step-bar-spacer{ flex:1 1 auto; }
  .chip{ font-size:11px; font-weight:500; padding:3px 9px; border-radius:10px; white-space:nowrap; }
  .chip-done{ background:var(--success-bg); color:var(--success); }
  .chip-current{ background:var(--info-bg); color:var(--info); }
  .chip-upcoming{ background:#EEEEEE; color:var(--text-secondary); }
  .chip-overdue{ background:var(--error-bg); color:var(--error); }
  .progress-mini{ font-size:12px; color:var(--text-secondary); min-width:38px; text-align:right; }
  .table-scroll{ overflow-x:auto; }
  table.sheet{ width:100%; min-width:520px; border-collapse:collapse; font-size:12.8px; }
  table.sheet th{ background:#FAFAFA; border:1px solid var(--border); padding:7px 10px; text-align:left; font-weight:500; color:var(--text-secondary); white-space:nowrap; }
  table.sheet td{ border:1px solid var(--border); padding:7px 10px; vertical-align:middle; background:#fff; color:var(--text); }
  table.sheet tbody tr:hover td{ background:#FAFAFA; }
  .check-cell{ text-align:center; width:34px; }
  .item-check{ width:16px; height:16px; accent-color:var(--primary); vertical-align:middle; pointer-events:none; }
  .name-done{ text-decoration:line-through; color:var(--text-secondary); }
  footer{ text-align:center; font-size:11px; color:var(--text-secondary); margin-top:30px; }
</style>
</head>
<body>
  <div class="appbar"><div class="appbar-inner"><span class="appbar-title">결혼 준비 타임라인</span></div></div>
  <div class="wrap">
    <div class="block summary-block">
      <div class="wedding-date-row">예식일 <b id="weddingDateText">-</b></div>
      <div class="dday-number" id="ddayNumber">D-0</div>
    </div>
    <div id="timelineList"></div>
    <footer>이 페이지는 보기 전용이에요. 실시간으로 최신 상태가 반영돼요.</footer>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCv4C_YQfPmq3vWAzfH9hicceBKn7uGDcQ",
  authDomain: "wedding-log-ab8be.firebaseapp.com",
  projectId: "wedding-log-ab8be",
  storageBucket: "wedding-log-ab8be.firebasestorage.app",
  messagingSenderId: "1051939244748",
  appId: "1:1051939244748:web:42e1b03187ce036f8c9069",
  measurementId: "G-MMCL30SMFV"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const settingsRef = doc(db, "app", "settings");
const checklistRef = doc(db, "app", "checklist");

let weddingDate = "2027-06-13";
let steps = [];

const $ = s => document.querySelector(s);

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}
function daysBetween(a,b){
  const MS = 86400000;
  const da = new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const db2 = new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((db2-da)/MS);
}
function subtractMonths(dateObj, months){
  const d = new Date(dateObj);
  const whole = Math.floor(months);
  const frac = months - whole;
  d.setMonth(d.getMonth() - whole);
  if(frac) d.setDate(d.getDate() - Math.round(frac*30));
  return d;
}
function monthsBeforeLabel(m){
  m = Number(m)||0;
  if(m <= 0) return 'D-DAY';
  const y = Math.floor(m/12);
  const rem = Math.round((m - y*12)*10)/10;
  let label = 'D-';
  if(y>0) label += `${y}년 `;
  if(rem>0 || y===0) label += `${rem}개월`;
  return label.trim();
}

function renderHero(){
  const wDate = new Date(weddingDate + 'T00:00:00');
  const today = new Date();
  const diff = daysBetween(today, wDate);
  $('#weddingDateText').textContent = fmtDate(weddingDate) + ' (' + ['일','월','화','수','목','금','토'][wDate.getDay()] + ')';
  const el = $('#ddayNumber');
  if(diff > 0) el.textContent = 'D-' + diff;
  else if(diff === 0) el.textContent = 'D-DAY';
  else el.textContent = 'D+' + Math.abs(diff);
}

function stepStatus(step, wDate, today){
  const dueDate = subtractMonths(wDate, step.monthsBefore);
  const total = step.items.length;
  const done = step.items.filter(i=>i.done).length;
  const allDone = total>0 && done===total;
  const passed = dueDate < today;
  let status = 'upcoming';
  if(allDone) status = 'done';
  else if(passed) status = 'overdue';
  return {dueDate, total, done, status};
}

function renderTimeline(){
  const wDate = new Date(weddingDate + 'T00:00:00');
  const today = new Date();
  const stepInfos = steps.map(s => ({s, info: stepStatus(s, wDate, today)}));
  let currentIdx = stepInfos.findIndex(x => x.info.dueDate >= today);
  if(currentIdx === -1) currentIdx = steps.length - 1;

  const container = $('#timelineList');
  container.innerHTML = '';

  stepInfos.forEach(({s, info}, idx) => {
    const block = document.createElement('div');
    block.className = 'step-block block';

    let chipHtml = '';
    if(info.status === 'done') chipHtml = `<span class="chip chip-done">완료</span>`;
    else if(info.status === 'overdue') chipHtml = `<span class="chip chip-overdue">지연</span>`;
    else if(idx === currentIdx) chipHtml = `<span class="chip chip-current">진행중</span>`;
    else chipHtml = `<span class="chip chip-upcoming">예정</span>`;

    const stepDayDiff = daysBetween(today, info.dueDate);
    const stepDdayText = stepDayDiff > 0 ? ('D-'+stepDayDiff) : (stepDayDiff === 0 ? 'D-DAY' : ('D+'+Math.abs(stepDayDiff)));

    block.innerHTML = `
      <div class="step-bar">
        <span class="step-title">${s.name}</span>
        <span class="step-when"><span class="step-dday-badge">${stepDdayText}</span> <span class="step-when-sep">·</span> ${monthsBeforeLabel(s.monthsBefore)} <span class="step-when-sep">·</span> ${fmtDate(info.dueDate.toISOString().slice(0,10))}</span>
        <span class="step-bar-spacer"></span>
        <span class="progress-mini">${info.done}/${info.total}</span>
        ${chipHtml}
      </div>
      <div class="table-scroll">
        <table class="sheet">
          <thead><tr><th></th><th>구분</th><th>완료일</th><th>메모</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    `;

    const tbody = block.querySelector('tbody');
    s.items.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="check-cell"><input type="checkbox" class="item-check" ${item.done?'checked':''} disabled></td>
        <td><span class="${item.done?'name-done':''}">${item.name}</span></td>
        <td>${fmtDate(item.doneDate) || ''}</td>
        <td>${item.memo || ''}</td>
      `;
      tbody.appendChild(tr);
    });

    container.appendChild(block);
  });
}

onSnapshot(settingsRef, snap => {
  weddingDate = (snap.exists() && snap.data().weddingDate) ? snap.data().weddingDate : weddingDate;
  renderHero();
  renderTimeline();
});
onSnapshot(checklistRef, snap => {
  steps = (snap.exists() && Array.isArray(snap.data().steps)) ? snap.data().steps : [];
  renderHero();
  renderTimeline();
});
</script>
</body>
</html>
